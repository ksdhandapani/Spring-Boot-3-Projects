apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-cards-deployment
  labels:
    app: ms-cards
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-cards
  template:
    metadata:
      labels:
        app: ms-cards
    spec:
      containers:
      - name: ms-cards
        image: dhandapaniks/ms-cards:0.0.7
        ports:
        - containerPort: 9000
        env:
        - name: SPRING_APPLICATION_NAME
          valueFrom:
            configMapKeyRef:
              name: xyzbank-configmap
              key: CARDS_APPLICATION_NAME
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: xyzbank-configmap
              key: SPRING_PROFILES_ACTIVE
        - name: SPRING_CONFIG_IMPORT
          valueFrom:
            configMapKeyRef:
              name: xyzbank-configmap
              key: SPRING_CONFIG_IMPORT
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE # We need this because our ms-cards has to register itself with the Eureka Server
          valueFrom:
            configMapKeyRef:
              name: xyzbank-configmap
              key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
---
apiVersion: v1
kind: Service
metadata:
  name: ms-cards
spec:
  selector:
    app: ms-cards
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
            